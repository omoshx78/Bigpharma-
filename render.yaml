databases:
  - name: dhs-pharmacy-db
    plan: free
    databaseName: dhs_pharmacy
    user: dhs_pharmacy

services:
  - type: web
    name: dhs-pharmacy-backend
    runtime: node
    plan: free
    rootDir: hms-backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dhs-pharmacy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        sync: false
      - key: API_BASE_URL
        sync: false # this backend's own public Render URL, e.g. https://dhs-pharmacy-backend.onrender.com
      - key: FRONTEND_URL
        sync: false # your Vercel URL, e.g. https://bigpharma.vercel.app
      - key: FLW_SECRET_KEY
        sync: false # from the Flutterwave dashboard — never commit this, set it directly on Render
      - key: FLW_WEBHOOK_SECRET_HASH
        sync: false # the "Secret Hash" you set under Flutterwave dashboard > Settings > Webhooks
      - key: SUBSCRIPTION_AMOUNT
        value: "15"
      - key: SUBSCRIPTION_CURRENCY
        value: USD
      - key: DARAJA_ENV
        value: sandbox # switch to "production" only once tested end-to-end
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false # your Paybill or Till number
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_TRANSACTION_TYPE
        value: CustomerPayBillOnline # use CustomerBuyGoodsOnline if DARAJA_SHORTCODE is a Till number
      - key: FX_MARKUP_PERCENT
        value: "0" # e.g. "2" adds 2% on top of the live USD->KES rate to cover slippage
      - key: FX_FALLBACK_USD_KES
        sync: false # optional manual rate used only if the live FX lookup fails; leave unset to fail cleanly instead
