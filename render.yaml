databases:
  - name: dhs-pharmacy-db
    plan: free
    databaseName: dhs_pharmacy
    user: dhs_pharmacy

services:
  - type: web
    name: dhs-pharmacy-backend
    runtime: node
    plan: free
    rootDir: hms-backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dhs-pharmacy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        sync: false
